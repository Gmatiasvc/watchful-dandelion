<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Asistencia QR{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    {% block extra_head %}{% endblock %}
</head>
<body class="bg-gray-50 min-h-screen flex flex-col text-gray-800 font-sans">

    <!-- Navigation Bar -->
    <nav class="bg-white shadow-md w-full z-10 no-print">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex items-center">
                    <a href="{% url 'index' %}" class="flex-shrink-0 flex items-center gap-2 text-indigo-600 hover:text-indigo-800 transition">
                        <i class="fas fa-qrcode text-2xl"></i>
                        <span class="font-bold text-xl tracking-tight">AsistenciaQR</span>
                    </a>
                </div>
                <div class="flex items-center space-x-4">
                    <a href="{% url 'registro' %}" class="text-gray-600 hover:text-indigo-600 px-3 py-2 rounded-md text-sm font-medium transition duration-150">
                        <i class="fas fa-user-plus mr-1"></i> Registro
                    </a>
                    <a href="{% url 'lector' %}" class="text-gray-600 hover:text-indigo-600 px-3 py-2 rounded-md text-sm font-medium transition duration-150">
                        <i class="fas fa-camera mr-1"></i> Escáner
                    </a>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content Area -->
    <main class="flex-grow flex flex-col items-center justify-center p-4 sm:p-6 lg:p-8">
        {% block content %}
        {% endblock %}
    </main>

    <!-- Footer -->
    <footer class="bg-white border-t border-gray-200 mt-auto no-print">
        <div class="max-w-7xl mx-auto py-6 px-4 sm:px-6 lg:px-8">
            <p class="text-center text-sm text-gray-500">
                &copy; {% now "Y" %} Sistema de Asistencia QR. Todos los derechos reservados.
            </p>
        </div>
    </footer>

    {% block extra_scripts %}{% endblock %}
</body>
</html>
